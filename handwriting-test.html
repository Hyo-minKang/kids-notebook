<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>예나 연습장 · 필기 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#F7F6FA;color:#1F2A44;font-family:'Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{padding:20px 24px 32px}
h1{margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:32px}
h2{margin:0 0 10px;font-family:'Jua',sans-serif;font-weight:400;font-size:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.pill{font-family:'Jua',sans-serif;font-size:24px;background:#fff;border:3px solid #1F2A44;border-radius:999px;padding:6px 20px;white-space:nowrap}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:#fff;border:3px solid #1F2A44;border-radius:24px;padding:20px}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.row{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap}
.label{font-size:17px;font-weight:500;color:#55607A;text-align:center}
.target{font-family:'Jua',sans-serif;font-size:130px;line-height:1;min-width:180px;text-align:center}
#pad{display:block;background:#fff;border:4px dashed #1F2A44;border-radius:28px;touch-action:none;cursor:crosshair}
#pad.done{border-style:solid;border-color:#5B4BD6}
#msg{font-family:'Jua',sans-serif;font-size:26px;min-height:36px;text-align:center}
#msg .num{color:#5B4BD6}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
button{font-family:'Jua',sans-serif;font-size:24px;color:#1F2A44;background:#fff;border:3px solid #1F2A44;border-radius:999px;padding:12px 30px;min-height:52px}
button.primary{background:#FF9EC4}
button.small{font-size:17px;padding:6px 16px;min-height:44px}
button:disabled{opacity:.4}
button[aria-pressed="true"]{background:#1F2A44;color:#fff}
.side{display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:17px;margin:0}
.kv dt{color:#55607A}
.kv dd{margin:0;font-weight:700;text-align:right}
#thumbs{display:flex;gap:12px;flex-wrap:wrap;min-height:84px}
.thumb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;font-weight:700}
.thumb canvas{width:56px;height:56px;border:2px solid #8A93A8;border-radius:8px;image-rendering:pixelated}
.thumb.low{color:#B4420A}
#misses{margin:0;padding-left:20px;font-size:17px;line-height:1.7}
.hint{font-size:15px;color:#55607A;line-height:1.5;margin:8px 0 0}
label.check{display:flex;align-items:center;gap:10px;font-size:17px;min-height:44px}
label.check input{width:24px;height:24px}
</style>
</head>
<body>
<div class="top">
  <h1>필기 테스트</h1>
  <div class="pill" id="score" aria-live="polite">맞게 읽음 0 / 0</div>
</div>
<div class="wrap">
  <div class="card stage">
    <div class="row">
      <div>
        <div class="label">이 숫자를 써 보자</div>
        <div class="target" id="target">47</div>
      </div>
      <canvas id="pad" aria-label="숫자를 쓰는 칸"></canvas>
    </div>
    <div id="msg" aria-live="polite">네모 안에 크게 써 보자</div>
    <div class="btns" id="btnsWrite">
      <button id="clear">지우기</button>
      <button id="submit" class="primary" disabled>다 썼어요</button>
    </div>
    <div class="btns" id="btnsDone" hidden>
      <button id="exclude">내가 잘못 썼어 (기록에서 빼기)</button>
      <button id="next" class="primary">다음 숫자</button>
    </div>
    <div class="btns" role="group" aria-label="쓰는 칸 크기">
      <button class="small" data-size="300,220" aria-pressed="false">칸 작게</button>
      <button class="small" data-size="380,300" aria-pressed="true">칸 보통</button>
      <button class="small" data-size="520,340" aria-pressed="false">칸 크게</button>
    </div>
  </div>
  <div class="side">
    <div class="card">
      <h2>이렇게 읽었어요</h2>
      <div id="thumbs"></div>
      <p class="hint">숫자 하나씩 나눠서 읽은 결과와 확신도입니다. 숫자가 붙어서 한 덩어리로 보이면 나누기가 잘못된 것입니다.</p>
    </div>
    <div class="card">
      <h2>펜 상태</h2>
      <dl class="kv">
        <dt>입력</dt><dd id="ptype">아직 없음</dd>
        <dt>필압 (최대)</dt><dd id="press">-</dd>
        <dt>초당 점 개수</dt><dd id="rate">-</dd>
      </dl>
      <label class="check"><input type="checkbox" id="penOnly"> 펜만 받기 (손바닥 무시)</label>
      <p class="hint">초당 점 개수가 100 이상이면 펜 움직임을 촘촘하게 받고 있는 것입니다.</p>
    </div>
    <div class="card">
      <h2>잘못 읽은 것</h2>
      <ol id="misses"></ol>
      <p class="hint" id="noMiss">아직 없어요.</p>
      <div class="btns" style="justify-content:flex-start;margin-top:10px"><button class="small" id="reset">기록 지우기</button></div>
    </div>
  </div>
</div>
<script>
// ---- 숫자 인식 (DOM 없이 동작) ----
function f16ToF32(b64) {
  var bin = atob(b64), n = bin.length >> 1, out = new Float32Array(n);
  for (var i = 0; i < n; i++) {
    var h = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
    var s = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 0x1f, f = h & 0x3ff;
    out[i] = e === 0 ? s * Math.pow(2, -14) * (f / 1024)
           : e === 31 ? (f ? NaN : s * Infinity)
           : s * Math.pow(2, e - 15) * (1 + f / 1024);
  }
  return out;
}
function loadModel(w) {
  var layers = [];
  for (var i = 0; w['W' + i]; i++) {
    layers.push({ W: f16ToF32(w['W' + i]), b: f16ToF32(w['b' + i]), nin: w['s' + i][0], nout: w['s' + i][1] });
  }
  return layers;
}
function predict(layers, x) {
  var a = x;
  for (var l = 0; l < layers.length; l++) {
    var L = layers[l], z = new Float32Array(L.nout);
    for (var j = 0; j < L.nout; j++) z[j] = L.b[j];
    for (var i = 0; i < L.nin; i++) {
      var v = a[i];
      if (v === 0) continue;
      var row = i * L.nout;
      for (var k = 0; k < L.nout; k++) z[k] += v * L.W[row + k];
    }
    if (l < layers.length - 1) for (var q = 0; q < L.nout; q++) if (z[q] < 0) z[q] = 0;
    a = z;
  }
  var m = -Infinity, sum = 0, p = new Float32Array(a.length);
  for (var c = 0; c < a.length; c++) if (a[c] > m) m = a[c];
  for (c = 0; c < a.length; c++) { p[c] = Math.exp(a[c] - m); sum += p[c]; }
  for (c = 0; c < a.length; c++) p[c] /= sum;
  return p;
}
function bbox(stroke) {
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (var i = 0; i < stroke.length; i++) {
    var p = stroke[i];
    if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x;
    if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y;
  }
  return { x0: x0, y0: y0, x1: x1, y1: y1 };
}
// 획을 가로 위치로 묶어 숫자 하나씩으로 나눈다.
function groupStrokes(strokes) {
  var items = strokes.filter(function (s) { return s.length > 0; })
    .map(function (s) { return { s: [s], b: bbox(s) }; })
    .sort(function (a, b) { return a.b.x0 - b.b.x0; });
  var groups = [];
  items.forEach(function (it) {
    var g = groups[groups.length - 1];
    if (g) {
      // 세로 한 줄처럼 폭이 없는 획도 겹침을 잴 수 있게 양쪽으로 3px 넓혀서 본다
      var overlap = Math.min(g.b.x1, it.b.x1) - Math.max(g.b.x0, it.b.x0) + 6;
      var minW = Math.min(g.b.x1 - g.b.x0, it.b.x1 - it.b.x0) + 6;
      if (overlap > 0.3 * minW) {
        g.s = g.s.concat(it.s);
        g.b = { x0: Math.min(g.b.x0, it.b.x0), y0: Math.min(g.b.y0, it.b.y0), x1: Math.max(g.b.x1, it.b.x1), y1: Math.max(g.b.y1, it.b.y1) };
        return;
      }
    }
    groups.push({ s: it.s, b: it.b });
  });
  return groups;
}
// 한 묶음을 MNIST 형식(28x28, 20px 상자, 무게중심 가운데)으로 그린다.
function rasterize(group) {
  var S = 112, R = 5.2, buf = new Float32Array(S * S);
  var w = group.b.x1 - group.b.x0, h = group.b.y1 - group.b.y0;
  var size = Math.max(w, h, 1), k = (80 - 2 * R) / size;
  var ox = (S - w * k) / 2 - group.b.x0 * k, oy = (S - h * k) / 2 - group.b.y0 * k;
  function seg(ax, ay, bx, by) {
    var minx = Math.max(0, Math.floor(Math.min(ax, bx) - R - 1)), maxx = Math.min(S - 1, Math.ceil(Math.max(ax, bx) + R + 1));
    var miny = Math.max(0, Math.floor(Math.min(ay, by) - R - 1)), maxy = Math.min(S - 1, Math.ceil(Math.max(ay, by) + R + 1));
    var dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    for (var y = miny; y <= maxy; y++) for (var x = minx; x <= maxx; x++) {
      var t = len2 ? ((x - ax) * dx + (y - ay) * dy) / len2 : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      var ex = x - (ax + t * dx), ey = y - (ay + t * dy);
      var v = R + 0.5 - Math.sqrt(ex * ex + ey * ey);
      if (v > 1) v = 1;
      if (v > buf[y * S + x]) buf[y * S + x] = v;
    }
  }
  group.s.forEach(function (st) {
    if (st.length === 1) seg(st[0].x * k + ox, st[0].y * k + oy, st[0].x * k + ox, st[0].y * k + oy);
    for (var i = 1; i < st.length; i++) seg(st[i - 1].x * k + ox, st[i - 1].y * k + oy, st[i].x * k + ox, st[i].y * k + oy);
  });
  var small = new Float32Array(784), mx = 0, my = 0, mass = 0;
  for (var y = 0; y < 28; y++) for (var x = 0; x < 28; x++) {
    var a = 0;
    for (var j = 0; j < 4; j++) for (var i = 0; i < 4; i++) a += buf[(y * 4 + j) * S + x * 4 + i];
    a /= 16; small[y * 28 + x] = a; mass += a; mx += a * x; my += a * y;
  }
  if (!mass) return small;
  var sx = Math.round(13.5 - mx / mass), sy = Math.round(13.5 - my / mass), out = new Float32Array(784);
  for (y = 0; y < 28; y++) for (x = 0; x < 28; x++) {
    var px = x - sx, py = y - sy;
    if (px >= 0 && px < 28 && py >= 0 && py < 28) out[y * 28 + x] = small[py * 28 + px];
  }
  return out;
}
// 획 전체를 읽어 { text, digits:[{d, p, img}] } 로 돌려준다.
function readNumber(layers, strokes) {
  var groups = groupStrokes(strokes).filter(function (g) {
    return Math.max(g.b.x1 - g.b.x0, g.b.y1 - g.b.y0) >= 10;   // 실수로 찍힌 점은 버린다
  });
  var digits = groups.map(function (g) {
    var img = rasterize(g), p = predict(layers, img), best = 0;
    for (var i = 1; i < 10; i++) if (p[i] > p[best]) best = i;
    return { d: best, p: p[best], img: img };
  });
  return { text: digits.map(function (x) { return x.d; }).join(''), digits: digits };
}
if (typeof module !== 'undefined' && module.exports) module.exports = { loadModel: loadModel, predict: predict, groupStrokes: groupStrokes, rasterize: rasterize, readNumber: readNumber };

</script>

  digits.forEach(function (d) {
    var wrap = document.createElement('div'); wrap.className = 'thumb' + (d.p < 0.8 ? ' low' : '');
    var c = document.createElement('canvas'); c.width = 28; c.height = 28;
    var g = c.getContext('2d'), im = g.createImageData(28, 28);
    for (var i = 0; i < 784; i++) {
      var v = 255 - Math.round(d.img[i] * 255);
      im.data[i * 4] = v; im.data[i * 4 + 1] = v; im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255;
    }
    g.putImageData(im, 0, 0);
    var t = document.createElement('div'); t.textContent = d.d + ' · ' + Math.round(d.p * 100) + '%';
    wrap.appendChild(c); wrap.appendChild(t); box.appendChild(wrap);
  });
}
function setMsg(parts) {
  var m = $('msg'); m.textContent = '';
  parts.forEach(function (p) {
    if (typeof p === 'string') m.appendChild(document.createTextNode(p));
    else { var s = document.createElement('span'); s.className = 'num'; s.textContent = p.num; m.appendChild(s); }
  });
}
$('submit').addEventListener('click', function () {
  var res = readNumber(layers, strokes);
  renderThumbs(res.digits);
  var ok = res.text !== '' && Number(res.text) === target && String(target) === res.text;
  total++; if (ok) correct++; else misses.push({ target: target, read: res.text });
  last = { ok: ok };
  if (res.text === '') setMsg(['잘 못 읽었어요']);
  else setMsg([{ num: res.text }, ok ? '(으)로 읽었어요. 맞아요' : '(으)로 읽었어요. ' + target + '이(가) 아니에요']);
  renderScore(); setLocked(true);
});
$('clear').addEventListener('click', clearPad);
function advance() { last = null; newTarget(); clearPad(); setLocked(false); setMsg(['네모 안에 크게 써 보자']); }
$('next').addEventListener('click', advance);
$('exclude').addEventListener('click', function () {
  if (last) { total--; if (last.ok) correct--; else misses.pop(); renderScore(); }
  advance();
});
$('reset').addEventListener('click', function () { total = 0; correct = 0; misses = []; renderScore(); advance(); $('thumbs').textContent = ''; });
$('penOnly').addEventListener('change', function (e) { penOnly = e.target.checked; penSeen = true; });
Array.prototype.forEach.call(document.querySelectorAll('[data-size]'), function (b) {
  b.addEventListener('click', function () {
    Array.prototype.forEach.call(document.querySelectorAll('[data-size]'), function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
    var s = b.getAttribute('data-size').split(',');
    sizePad(Number(s[0]), Number(s[1]));
    if (locked) advance();
  });
});
sizePad(380, 300); renderScore();
</script>
</body>
