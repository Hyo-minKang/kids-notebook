<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>우리의 연습장</title>
<!-- 홈 화면에 추가하면 브라우저 주소창 없이 앱처럼 열린다 (직접 호스팅했을 때) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 연습장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F6FA">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2A44;--sub:#55607A;--bg:#F7F6FA;--accent:#FF9EC4;--violet:#5B4BD6;--line:#8A93A8;--soft:#D9D7E6}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;overscroll-behavior:none;margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.jua{font-family:'Jua',sans-serif;font-weight:400}
button{font-family:'Jua',sans-serif;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;font-size:clamp(20px,2.7vw,32px);padding:clamp(10px,1.5vw,18px) clamp(24px,4vw,56px);min-height:48px}
button.primary{background:var(--accent)}
button:disabled{opacity:.4}
.view{height:100%;overflow:hidden;touch-action:none;max-width:1194px;margin:0 auto;padding:clamp(16px,3vw,40px) clamp(16px,4.5vw,56px);display:flex;flex-direction:column;gap:clamp(14px,2vw,24px)}
.card{background:#fff;border:3px solid var(--ink);border-radius:28px}
.sub{color:var(--sub)}

/* 홈만 세로로 넘길 수 있다. 풀이·결과 화면은 움직이지 않는다 */
#home{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}

/* 홈 */
.hometop{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hometop h1{margin:0;font-size:clamp(30px,4vw,48px)}
.pill{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 22px;font-size:clamp(22px,2.7vw,32px)}
.homegrid{flex:1;display:grid;grid-template-columns:1.7fr 1fr;gap:clamp(14px,2vw,24px)}
@media (max-width:820px){.homegrid{grid-template-columns:1fr}}
.today{display:flex;flex-direction:column;gap:clamp(14px,1.8vw,22px);padding:clamp(18px,2.7vw,32px)}
.todayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.todayhead .k{font-size:clamp(15px,1.7vw,20px);font-weight:700;color:var(--violet)}
.todayhead .t{font-size:clamp(28px,3.7vw,44px);line-height:1.1;margin:6px 0}
.todayhead .d{font-size:clamp(15px,1.7vw,20px);font-weight:500}
.todayhead .n{font-size:clamp(20px,2.5vw,30px);white-space:nowrap}
.tiles{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(8px,1.2vw,14px);min-height:180px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:22px;font-size:clamp(24px,3.4vw,40px);line-height:1.1;border:3px dashed var(--line);color:var(--sub)}
.tile.done{background:var(--accent);border:3px solid var(--ink);color:var(--ink);flex-direction:row;gap:6px}
.tile.now{background:#fff;border:5px solid var(--violet);color:var(--ink)}
.tile small{font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;color:var(--violet)}
.sidecol{display:flex;flex-direction:column;gap:clamp(12px,1.7vw,20px)}
.sidebtn{display:flex;align-items:center;gap:18px;text-align:left;padding:clamp(14px,2vw,24px);border-radius:28px;font-family:'Noto Sans KR',sans-serif}
.sidebtn .t{font-family:'Jua',sans-serif;font-size:clamp(22px,2.5vw,30px);display:block}
.sidebtn .d{font-size:clamp(15px,1.6vw,19px);color:var(--sub);display:block;margin-top:4px}
.sidebtn.tall{flex:1;flex-direction:column;align-items:flex-start;justify-content:space-between}
.sidebtn .mark{font-family:'Jua',sans-serif;font-size:clamp(36px,5vw,60px);line-height:1}
.board{display:flex;align-items:center;gap:clamp(12px,2vw,24px);padding:14px clamp(16px,2.7vw,32px);flex-wrap:wrap}
.board .t{font-size:clamp(20px,2.2vw,26px);white-space:nowrap}
.slots{display:flex;gap:clamp(6px,1vw,12px);flex:1}
.slot{width:clamp(28px,4vw,48px);height:clamp(28px,4vw,48px);border-radius:50%;border:3px dashed var(--line)}
.slot.on{background:var(--accent);border:3px solid var(--ink)}
.board .d{font-size:clamp(14px,1.6vw,19px);white-space:nowrap}
.homefoot{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.parent{font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;padding:8px 16px;min-height:44px;border-width:2px;color:var(--sub);border-color:var(--line)}

.overlay{position:fixed;inset:0;z-index:10;background:rgba(31,42,68,.45);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.sheet{width:100%;max-width:560px;padding:clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.sheet h2{margin:0;font-size:30px}
.field{font-size:17px;font-weight:700;margin-top:8px}
.note{font-size:15px;color:var(--sub);line-height:1.5}
#nameInput{font-family:'Noto Sans KR',sans-serif;font-size:22px;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:10px 16px;width:100%;-webkit-user-select:text;user-select:text}
.levels{display:flex;flex-direction:column;gap:8px}
.levels button{font-family:'Noto Sans KR',sans-serif;border-radius:18px;text-align:left;padding:12px 18px;font-size:18px;font-weight:700;line-height:1.4}
.levels button span{display:block;font-size:15px;font-weight:400;color:var(--sub)}
.levels button[aria-pressed="true"]{background:var(--accent)}
.levels button[aria-pressed="true"] span{color:var(--ink)}
.sheetfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}

.rewardsheet{max-width:860px;text-align:center;align-items:stretch}
.rewardsheet h2{font-size:clamp(30px,4.4vw,48px)}
.rewardsub{font-size:clamp(17px,2.2vw,24px);font-weight:500;color:var(--sub);margin:6px 0 16px}
.rewardgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:760px){.rewardgrid{grid-template-columns:repeat(2,1fr)}}
.rewardbtn{word-break:keep-all;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:24px;padding:18px 8px;font-size:clamp(17px,2vw,22px);line-height:1.25;min-height:150px}
.rewardbtn:active{background:var(--accent)}
#rewardDone{display:flex;flex-direction:column;align-items:center;gap:8px}
#rewardIcon{width:140px;height:140px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center}
.given{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:17px;padding:6px 0}
.given button{font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;padding:6px 16px;min-height:44px;border-width:2px}

/* 풀이 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.round{width:60px;height:60px;min-height:60px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.dots{display:flex;align-items:center;gap:clamp(4px,.85vw,10px)}
.dot{width:clamp(16px,2.3vw,28px);height:clamp(16px,2.3vw,28px);border-radius:50%;background:var(--soft)}
.dot.ok{background:var(--violet)}
.dot.lock{background:#fff;border:3px solid var(--ink)}
.dot.cur{width:clamp(22px,3vw,36px);height:clamp(22px,3vw,36px);background:var(--accent);border:3px solid var(--ink)}
.count{font-size:clamp(18px,2.2vw,26px);white-space:nowrap}
.tag{align-self:center;padding:8px 22px;background:#fff;border:3px solid var(--violet);border-radius:999px;font-size:clamp(15px,1.7vw,20px);font-weight:700;color:var(--violet)}
.work{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(16px,3vw,36px);flex-wrap:wrap}
.q{font-size:clamp(64px,min(13.4vw,19vh),160px);line-height:1;white-space:nowrap}
#pad{display:block;background:#fff;border:4px dashed var(--ink);border-radius:36px;touch-action:none}
#pad.held{border-style:solid;border-color:var(--violet)}
#pad.right{border-style:solid;background:var(--accent)}
.answer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#ECEAF4;border:4px solid var(--ink);border-radius:36px}
.answer .v{font-size:clamp(110px,15vw,180px);line-height:1;color:var(--violet)}
.answer .l{font-size:20px;font-weight:700;color:var(--sub)}
.foot{min-height:clamp(120px,min(20vw,24vh),190px);display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(12px,2vw,24px)}
.msg{text-align:center;font-size:clamp(22px,3vw,34px)}
.chance{display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(15px,1.7vw,20px);font-weight:500;color:var(--sub)}
.chance i{width:22px;height:22px;border-radius:50%;background:var(--ink)}
.chance i.off{background:none;border:3px solid var(--line)}
.btns{display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,24px);flex-wrap:wrap}
.panel{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:clamp(14px,2vw,24px) clamp(18px,3vw,36px);flex-wrap:wrap}
.panel .big{font-size:clamp(26px,3.7vw,44px)}
.panel .big b{font-weight:400;color:var(--violet)}
.panel .d{font-size:clamp(15px,1.7vw,20px);font-weight:500;color:var(--sub);margin-top:4px}

.work.vertical{flex-direction:column;flex-wrap:nowrap;gap:10px}
.q.vq{display:flex;flex-direction:column;line-height:1.12;border-bottom:6px solid var(--ink);padding:0 10px 4px;box-sizing:border-box}
.vrow{display:flex;justify-content:flex-end;letter-spacing:.06em}
.vrow i{font-style:normal;margin-right:auto}

/* 결과 */
#result{align-items:center;justify-content:center;gap:clamp(18px,2.7vw,32px);text-align:center}
.stars{display:flex;gap:20px;min-height:20px}
#result h1{margin:0;font-size:clamp(48px,7vw,84px);line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,240px));gap:clamp(10px,1.7vw,20px)}
.stat{padding:clamp(14px,2vw,24px);display:flex;flex-direction:column;align-items:center;gap:6px}
.stat .v{font-size:clamp(40px,5.4vw,64px);line-height:1}
.stat .l{font-size:clamp(14px,1.7vw,20px);font-weight:500;color:var(--sub)}
.stat .v.small{font-size:clamp(20px,2.6vw,30px);line-height:1.3;color:var(--violet)}
</style>
</head>
<body>

<section id="home" class="view">
  <div class="hometop">
    <h1 class="jua" id="homeTitle">우리의 연습장</h1>
    <div class="pill jua" aria-label="모은 스티커">
      <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="#FF9EC4" stroke="#1F2A44" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
      <span id="stickerCount">0</span>
    </div>
  </div>
  <div class="homegrid">
    <div class="card today">
      <div class="todayhead">
        <div>
          <div class="k">오늘 할 것 · 수학</div>
          <div class="t jua" id="levelTitle">더하기 1단계</div>
          <div class="d sub" id="levelDesc"></div>
        </div>
        <div class="n jua" id="pageCount">0 / 10장</div>
      </div>
      <div class="tiles" id="tiles"></div>
      <button class="primary" id="startBtn">1장 시작하기</button>
    </div>
    <div class="sidecol">
      <button class="sidebtn" id="reviewBtn">
        <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#5B4BD6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
        <span><span class="t">다시 풀기</span><span class="d" id="reviewDesc">오늘 다시 풀 문제가 없어요</span></span>
      </button>
      <button class="sidebtn tall" disabled>
        <span class="mark">가나</span>
        <span><span class="t">받아쓰기</span><span class="d">준비 중</span></span>
      </button>
      <button class="sidebtn tall" disabled>
        <span class="mark">Abc</span>
        <span><span class="t">영어 단어</span><span class="d">준비 중</span></span>
      </button>
    </div>
  </div>
  <div class="card board">
    <div class="t jua">스티커판</div>
    <div class="slots" id="slots"></div>
    <div class="d sub" id="boardDesc"></div>
  </div>
  <div class="homefoot">
    <button class="parent" id="fullBtn" hidden>전체 화면</button>
    <button class="parent" id="soundBtn">소리 켜짐</button>
    <button class="parent" id="settingsBtn">부모님 설정</button>
  </div>
</section>

<div id="settings" class="overlay" hidden>
  <div class="card sheet" role="dialog" aria-labelledby="settingsTitle">
    <h2 class="jua" id="settingsTitle">부모님 설정</h2>
    <label class="field" for="nameInput">이름</label>
    <input id="nameInput" type="text" maxlength="10" autocomplete="off" autocapitalize="off">
    <div class="note">홈 화면에 "<span id="namePreview">우리</span>의 연습장"으로 나와요.</div>
    <div class="field">오늘 할 단계</div>
    <div id="levelList" class="levels"></div>
    <div class="note">단계를 바꾸면 풀던 장은 그 단계의 새 문제로 다시 시작해요. 끝낸 장 수와 스티커는 그대로예요.</div>
    <div class="field">아이가 고른 선물</div>
    <div id="rewardList" class="levels"></div>
    <div class="note" id="versionText"></div>
    <div class="sheetfoot">
      <button class="parent" id="resetBtn">처음부터 다시</button>
      <button class="primary" id="closeSettings">닫기</button>
    </div>
  </div>
</div>

<div id="reward" class="overlay" hidden>
  <div class="card sheet rewardsheet" role="dialog" aria-labelledby="rewardTitle">
    <div id="rewardPick">
      <h2 class="jua" id="rewardTitle">스티커 한 줄 완성!</h2>
      <div class="rewardsub">선물을 하나 골라 보자</div>
      <div id="rewardGrid" class="rewardgrid"></div>
    </div>
    <div id="rewardDone" hidden>
      <div id="rewardIcon"></div>
      <h2 class="jua" id="rewardChosen"></h2>
      <div class="rewardsub">엄마 아빠에게 보여 주자</div>
      <button class="primary" id="rewardOk">좋아요</button>
    </div>
  </div>
</div>

<section id="solve" class="view" hidden>
  <div class="bar">
    <button class="round" id="backBtn" aria-label="나가기">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="dots" id="dots"></div>
    <div class="count jua" id="count"></div>
  </div>
  <div class="tag" id="reviewTag" hidden>전에 만났던 문제</div>
  <div class="work">
    <div class="q jua" id="q"></div>
    <canvas id="pad" aria-label="답을 쓰는 칸"></canvas>
    <div class="answer" id="answerBox" hidden><span class="v jua" id="answerVal"></span><span class="l">정답</span></div>
  </div>
  <div class="foot" id="foot"></div>
</section>

<section id="result" class="view" hidden>
  <div class="stars" id="stars"></div>
  <h1 class="jua" id="resultTitle">참 잘했어요</h1>
  <div class="stats">
    <div class="card stat"><span class="v jua" id="statSolved">0</span><span class="l" id="statSolvedL">10문제 중 맞힌 문제</span></div>
    <div class="card stat"><span class="v jua" id="statFirst">0</span><span class="l">한 번에 맞힌 문제</span></div>
    <div class="card stat"><span class="v jua" id="statLocked">0</span><span class="l">내일 다시 만날 문제</span></div>
  </div>
  <div class="btns">
    <button id="doneBtn">끝내기</button>
    <button class="primary" id="moreBtn">다음 장 하기</button>
  </div>
</section>

<!-- 단계 목록. 단계를 추가하려면 여기에 한 덩어리를 붙인다. 항목 설명은 README.md 참고 -->
<script type="application/json" id="levelsData">
[
  { "id": "plus-4", "title": "1단계 · 4 더하기", "desc": "1부터 15까지의 수에 4 더하기", "op": "+", "range": [[1, 15], [4, 4]] },
  { "id": "plus-5", "title": "2단계 · 5 더하기", "desc": "1부터 15까지의 수에 5 더하기", "op": "+", "range": [[1, 15], [5, 5]] },
  { "id": "plus-6", "title": "3단계 · 6 더하기", "desc": "1부터 15까지의 수에 6 더하기", "op": "+", "range": [[1, 15], [6, 6]] },
  { "id": "plus-7", "title": "4단계 · 7 더하기", "desc": "1부터 15까지의 수에 7 더하기", "op": "+", "range": [[1, 15], [7, 7]] },
  { "id": "plus-8", "title": "5단계 · 8 더하기", "desc": "1부터 15까지의 수에 8 더하기", "op": "+", "range": [[1, 15], [8, 8]] },
  { "id": "plus-9", "title": "6단계 · 9 더하기", "desc": "1부터 15까지의 수에 9 더하기", "op": "+", "range": [[1, 15], [9, 9]] },
  { "id": "add-1", "title": "두 자리 + 한 자리", "desc": "두 자리 수와 한 자리 수 더하기", "op": "+", "digits": [2, 1], "shuffle": true, "max": 100, "carry": "any" },
  { "id": "add-2", "title": "두 자리 + 두 자리", "desc": "두 자리 수끼리 더하기", "op": "+", "digits": [2, 2], "max": 100, "carry": "any" },
  { "id": "sub-1", "title": "두 자리 − 한 자리", "desc": "두 자리 수에서 한 자리 수 빼기", "op": "-", "digits": [2, 1], "max": 99, "carry": "none" }
]
</script>

[

]

var layers = loadModel(WEIGHTS);
var $ = function (id) { return document.getElementById(id); };
var APP_VERSION = '0.3';
var PAGE_SIZE = 10, PAGES_PER_DAY = 10, MAX_ATTEMPTS = 2, REVIEW_DAYS = [1, 3, 7], KEY = 'kids-notebook-v1';

    footHtml('<div class="msg jua" id="msg">' + (sess.mode === 'review' ? '이번에는 맞힐 수 있어' : '네모 안에 답을 크게 써 보자') + '</div>' + writeBtns);
  } else if (phase === 'retry') {
    dirty = false;   // 틀린 답은 그대로 남겨 두고, 고쳐 써야 다시 낼 수 있다
    footHtml('<div><div class="msg jua" id="msg">아쉬워, 지우고 한 번 더 해볼까?</div><div class="chance"><span>남은 기회</span><i></i><i class="off"></i><span>한 번</span></div></div>' + writeBtns);
  } else if (phase === 'confirm') {
    footHtml('<div class="card panel"><div class="big jua"><b>' + n + '</b>' + (hasBatchim(n) ? '이라고' : '라고') + ' 썼구나?</div><div class="btns"><button id="againBtn">다시 쓸래</button><button class="primary" id="yesBtn">응, 맞아</button></div></div>');
    $('againBtn').addEventListener('click', function () { clearPad(); setPhase(sess.data.attempts > 0 ? 'retry' : 'write'); dirty = true; });
    $('yesBtn').addEventListener('click', function () { grade(n); });
  } else if (phase === 'correct') {
    footHtml('<div class="card panel"><div class="big jua">정답이에요</div><button class="primary" id="nextBtn">다음 문제</button></div>');
  } else if (phase === 'locked') {
    pad.hidden = true; $('answerBox').hidden = false; $('answerVal').textContent = ans;
    footHtml('<div class="card panel"><div><div class="big jua">정답은 <b>' + ans + '</b>' + (hasBatchim(ans) ? '이야' : '야') + '</div><div class="d">이 문제는 내일 "다시 풀기"에서 다시 만나요</div></div><button class="primary" id="nextBtn">다음 문제</button></div>');
  }
  if ($('clearBtn')) $('clearBtn').addEventListener('click', clearPad);
  if ($('submitBtn')) { $('submitBtn').addEventListener('click', submit); syncSubmit(); }
  if ($('nextBtn')) $('nextBtn').addEventListener('click', next);
}
// 읽은 값이 정답이면 묻지 않고 바로 정답 처리한다.
// 정답과 다르면 "…라고 썼구나?" 로 먼저 확인하고, "응, 맞아"를 눌러야 틀린 것으로 센다 (잘못 읽은 것은 세지 않는다).
function submit() {
  var res = readNumber(layers, strokes), p = problem();
  if (res.text === '' || res.text.length > 3) { sfx('ask'); $('msg').textContent = '잘 못 읽었어. 지우고 조금 더 크게 써 줄래?'; dirty = false; syncSubmit(); return; }
  var n = Number(res.text);
  if (n === answerOf(p)) { grade(n); return; }
  sfx('ask');
  setPhase('confirm', n);
}
function grade(n) {
  var d = sess.data, p = problem();
  if (n === answerOf(p)) {
    d.results[d.i] = d.attempts === 0 ? 'first' : 'second';
    if (sess.mode === 'review') passReview(p);
    save(); sfx('correct'); setPhase('correct'); return;
  }
  d.attempts++;
  if (d.attempts >= MAX_ATTEMPTS) { d.results[d.i] = 'locked'; addReview(p); save(); sfx('locked'); setPhase('locked'); }
  else { save(); sfx('retry'); setPhase('retry'); }
}
function next() {
  var d = sess.data;
  d.i++; d.attempts = 0;
  if (d.i >= d.problems.length) { finish(); return; }
  save(); showProblem();
}
$('backBtn').addEventListener('click', function () { save(); renderHome(); });

// ---------- 결과 ----------
function finish() {
  var d = sess.data, first = 0, solved = 0, locked = [];
  d.results.forEach(function (r, i) { if (r === 'first') first++; if (r === 'first' || r === 'second') solved++; if (r === 'locked') locked.push(d.problems[i]); });
  var earned = 0;
  if (sess.mode === 'page') {
    earned = 1 + (first === d.problems.length ? 1 : 0);   // 한 장 끝내면 1개, 전부 한 번에 맞히면 1개 더
    var rowsBefore = Math.floor(state.stickers / 10);
    state.stickers += earned;
    state.pendingRewards = (state.pendingRewards || 0) + Math.floor(state.stickers / 10) - rowsBefore;   // 한 줄을 채울 때마다 선물 고르기 한 번
    state.done = Math.max(state.done, d.pageNo); state.cur = null;
  }
  save();
  var stars = '';
  for (var i = 0; i < earned; i++) stars += '<svg role="img" aria-label="스티커" width="110" height="110" viewBox="0 0 24 24" fill="#FF9EC4" stroke="#1F2A44" stroke-width="1.2" stroke-linejoin="round">' + STAR + '</svg>';
  $('stars').innerHTML = stars;
  $('resultTitle').textContent = sess.mode === 'review' ? '다시 풀기 끝' : '참 잘했어요';
  $('statSolved').textContent = solved; $('statSolvedL').textContent = d.problems.length + '문제 중 맞힌 문제';
  $('statFirst').textContent = first;
  var sl = $('statLocked');
  if (locked.length && locked.length <= 3) { sl.className = 'v jua small'; sl.innerHTML = locked.map(qText).join('<br>'); }
  else { sl.className = 'v jua'; sl.textContent = locked.length; }
  $('moreBtn').hidden = sess.mode === 'review';
  $('moreBtn').textContent = state.done >= PAGES_PER_DAY ? '한 장 더 하기' : '다음 장 하기';
  sfx('finish');
  show('result');
}
$('doneBtn').addEventListener('click', renderHome);
$('moreBtn').addEventListener('click', function () { $('startBtn').click(); });

// 풀이·결과 화면에서는 손가락이나 펜으로 화면을 끌어도 페이지가 움직이지 않게 한다
document.addEventListener('touchmove', function (e) {
  if (!(e.target.closest && e.target.closest('#home, .sheet'))) e.preventDefault();
}, { passive: false });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
window.addEventListener('resize', function () { if (!$('solve').hidden) { sizePad(); clearPad(); } });
// 홈 화면에 추가해 앱처럼 열었을 때는 이미 전체 화면이므로 버튼을 숨긴다
if (window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)) $('fullBtn').hidden = true;

load(); renderHome();
</script>
</body>
</html>
